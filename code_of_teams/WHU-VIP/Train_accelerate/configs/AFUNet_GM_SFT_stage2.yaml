# Stage 2: Fine-tune with strong augmentation — improve generalization
name: "AFUNet_GM_SFT_stage2"
seed: 42

paths:
  train_dir: "./datas"
  log_root:  "./checkpoints"
  resume_path:         null
  pretrained_backbone: "./checkpoints/AFUNet_GM_SFT_stage1/latest_ema_model.pth"

data:
  num_workers:     8
  batch_size:      3
  crop_size:       256
  dataset_repeats: 3
  use_strong_aug:  true       # Enable strong augmentation from stage 2

model:
  filename: "AFUNet_GM_SFT"
  type:     "AFUNet"

train:
  epochs:           60
  lr:               8e-5
  min_lr:           1.0e-6
  grad_accum_steps: 1
  log_interval:     50
  use_lpips_weighted: false
  use_ste_quant:      false
  use_ema:            true
  ema_decay:          0.999
