# general settings
name: Uformer
model_type: SRModel
scale: 1
num_gpu: 1 # auto: can infer from your visible devices automatically. official: 8 GPUs
manual_seed: 42
find_unused_parameters: true

# dataset and data loader settings
datasets:
  train:
    name: TrainSet
    type: HDR_Dataset
    dataroot: datasets/train
    max_others: 4
    geometric_augs: true

    filename_tmpl: "{}"
    io_backend:
      type: disk

    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    gt_size: 768 # Max patch size for progressive training
    # data loader
    use_shuffle: true
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  # Uncomment these for validation
  val:
    name: ValSet
    type: HDR_Dataset
    gt_size: 768
    dataroot: datasets/train
    io_backend:
      type: disk

# network structures
network_g:
  type: Uformer
  dd_in: 18
  depths: [1,2,2,2,2,2,2,2,1]

# path
path:
  pretrain_network_g: ~
  param_key_g: params_ema
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 60000
  warmup_iter: -1 # no warm up
  use_grad_clip: ~
#  ema_decay: 0.999


#  optim_g:
#    type: AdamW
#    lr: !!float 3e-4
#    weight_decay: !!float 1e-4
#    betas: [ 0.9, 0.999 ]

  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [ 0.9, 0.999 ]

#  scheduler:
#    type: CosineAnnealingRestartCyclicLR
#    periods: [ 92000, 208000 ]
#    restart_weights: [ 1,1 ]
#    eta_mins: [ 0.0003,0.000001 ]

  scheduler:
    type: MultiStepLR
    milestones: [ 10000,20000,30000,40000]
    gamma: 0.5

  # losses
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-3

  ssim_opt:
    type: SSIMLoss
    loss_weight: 0.5
    window_size: 11

  grad_opt:
    type: GradientLoss
    loss_weight: 0.5

  color_opt:
    type: ColorLoss
    loss_weight: 0.5
    patch_size: 16

  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      'conv5_4': 1.0
    vgg_type: vgg19
    use_input_norm: true
    range_norm: false
    loss_weight: 1.0

# Uncomment these for validation
# validation settings
val:
  val_freq: !!float 1e3
  save_img: true

  metrics:
    psnr: # metric name
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
